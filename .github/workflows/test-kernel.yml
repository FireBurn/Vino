name: test kernel

on:
  push:
    paths:
      - linux
      - .github/workflows/test-kernel.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a pre-release
        type: boolean
        default: true

permissions:
  contents: write

env:
  LLVM_SUFFIX: "-18"
  # setlocalversion appends "+" unless LOCALVERSION is set, which would put a "+" in every
  # package name and kernel release. Set it, empty: the version comes from CONFIG_LOCALVERSION.
  LOCALVERSION: ""
  RUST_VERSION: "1.97.1"
  BINDGEN_VERSION: "0.72.1"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Reclaim runner disk
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          large-packages: false

      # Shallow. The submodule is the Linux tree, so a full clone fetches twenty years of history
      # on every run; the only thing that needed it was `git describe`, and the submodule SHA
      # below says the same thing for release provenance.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # build-essential and libdw-dev are what dpkg-checkbuilddeps demands for bindeb-pkg;
          # the rest are the kernel's own.
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libdw-dev libelf-dev libssl-dev \
            debhelper rsync kmod cpio rpm \
            clang${LLVM_SUFFIX} lld${LLVM_SUFFIX} llvm${LLVM_SUFFIX}
          # rustfmt is not optional in practice: bindgen shells out to it for the generated
          # bindings and complains on every invocation without it.
          rustup toolchain install "$RUST_VERSION" --component rust-src --component rustfmt
          rustup default "$RUST_VERSION"
          cargo install --locked bindgen-cli --version "$BINDGEN_VERSION"

      - name: Configure
        id: cfg
        working-directory: linux
        run: |
          make LLVM=$LLVM_SUFFIX rustavailable

          # Name the build after the submodule commit, not just the day. A date alone means two
          # pushes in one day produce identical package filenames and collide on the release tag,
          # and nothing installed on a tester's machine says which tree it came from.
          base=$(git rev-parse --short=12 HEAD)
          short=$(git rev-parse --short=7 HEAD)

          zcat /proc/config.gz 2>/dev/null > .config || cp /boot/config-$(uname -r) .config
          # "Debug information" is a choice, and --enable does not clear the sibling the runner's
          # own config already sets. Both then arrive =y, olddefconfig keeps the DWARF one, and it
          # selects DEBUG_INFO and trips the guard below. Disable the three members that select it
          # rather than only enabling the one that does not.
          scripts/config \
            --enable RUST \
            --module DRM_VINO \
            --module DRM_EVDI \
            --enable EXPERT \
            --disable MODVERSIONS \
            --disable DEBUG_INFO_BTF \
            --enable DEBUG_INFO_NONE \
            --disable DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT \
            --disable DEBUG_INFO_DWARF4 \
            --disable DEBUG_INFO_DWARF5 \
            --disable MODULE_SIG_ALL \
            --disable SYSTEM_TRUSTED_KEYS \
            --disable SYSTEM_REVOCATION_KEYS \
            --set-str LOCALVERSION "-vino-$(date -u +%Y%m%d)-g$short"
          make LLVM=$LLVM_SUFFIX olddefconfig

          # olddefconfig silently drops anything whose dependencies are unmet, and a kernel
          # published without the driver in it is worse than a failed build.
          for opt in CONFIG_RUST=y CONFIG_DRM_VINO=m; do
            grep -qx "$opt" .config || { echo "::error::$opt did not survive olddefconfig"; exit 1; }
          done
          # Debug info is what made the first rpm 1.1 GB: the deb split it into a -dbg package that
          # was filtered out, so only the rpm showed it. Assert it is off rather than trusting the
          # choice symbol to have taken.
          if grep -qx "CONFIG_DEBUG_INFO=y" .config; then
            echo "::error::debug info is enabled; packages will be enormous"; exit 1
          fi

          echo "release=$(make -s LLVM=$LLVM_SUFFIX kernelrelease)" >> "$GITHUB_OUTPUT"
          # The deb package name is already linux-image-$(KERNELRELEASE), so putting the release
          # in the version too prints it twice in every filename. Debian's own kernels carry the
          # upstream version there instead; "~rc" so a release candidate sorts below the release.
          echo "version=$(make -s kernelversion | sed 's/-rc/~rc/')" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Build the kernel
        working-directory: linux
        run: make LLVM=$LLVM_SUFFIX -j"$(nproc)" all

      # One package format per step. Given both targets at once make runs them concurrently, so a
      # failure in either is reported two hours later against whichever finished last.
      - name: Build the deb
        working-directory: linux
        env:
          KDEB_PKGVERSION: ${{ steps.cfg.outputs.version }}-1
        run: make LLVM=$LLVM_SUFFIX -j"$(nproc)" bindeb-pkg

      - name: Build the rpm
        working-directory: linux
        run: |
          # The rpm takes its Release: from scripts/build-version, a counter in .version that
          # increments on every read. The kernel build already consumed 1, so the rpm would come
          # out -2 against the deb's -1 -- a difference that means nothing to anyone reading it.
          echo 0 > .version
          make LLVM=$LLVM_SUFFIX -j"$(nproc)" binrpm-pkg

      - name: Collect the packages
        run: |
          mkdir -p out
          # linux-libc-dev and its rpm twin kernel-headers are the UAPI headers glibc is built
          # against, not the kernel's own. They are distribution-wide packages, so installing one
          # replaces a tester's system headers with an -rc kernel's: no use here, and a good way to
          # break a toolchain. kernel-devel/linux-headers are the ones that build modules; keep those.
          find . -name '*.deb' -o -name '*.rpm' \
            | grep -vE 'dbg|debuginfo|linux-libc-dev|kernel-headers' | xargs -r cp -t out

          # dpkg always writes <package>_<version>_<arch>.deb, and the package name already carries
          # the kernel release, so the version restates what the name has said. Drop it from the
          # published filename: dpkg reads the version out of the archive, not off the name, so
          # `dpkg -i` is unaffected. The rpms keep their own naming, which does not repeat itself.
          for deb in out/*.deb; do
              [ -e "$deb" ] || continue
              name="$(dpkg-deb -f "$deb" Package)"
              arch="$(dpkg-deb -f "$deb" Architecture)"
              [ -n "$name" ] && [ -n "$arch" ] || { echo "::error::cannot read fields from $deb"; exit 1; }
              target="out/${name}_${arch}.deb"
              [ "$deb" = "$target" ] || mv -- "$deb" "$target"
          done
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ steps.cfg.outputs.release }}
          path: out/*

      - name: Publish pre-release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ steps.cfg.outputs.release }}
          BASE: ${{ steps.cfg.outputs.base }}
        run: |
          {
            echo "Kernel \`$RELEASE\`, built from linux \`$BASE\` at \`${GITHUB_SHA:0:12}\`."
            echo
            cat .github/RELEASE_NOTES.md
          } > notes.md

          # The release name now carries the submodule SHA, so it is stable across re-runs of the
          # same commit. Replace the assets in that case rather than failing on the existing tag.
          if gh release view "$RELEASE" >/dev/null 2>&1; then
            gh release upload "$RELEASE" out/* --clobber
            gh release edit "$RELEASE" --notes-file notes.md
          else
            gh release create "$RELEASE" out/* \
              --prerelease \
              --title "Vino test kernel $RELEASE" \
              --notes-file notes.md
          fi
